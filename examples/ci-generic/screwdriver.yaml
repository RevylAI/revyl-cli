# Screwdriver CI -- Revyl test pipeline
#
# Add REVYL_API_KEY as a secret in your Screwdriver pipeline settings.

shared:
  image: alpine:latest
  environment:
    REVYL_API_KEY: ${REVYL_API_KEY}
    REVYL_INSTALL_DIR: /usr/local/bin

jobs:
  # Run tests on every PR and commit (blocks until complete)
  test:
    requires: [~pr, ~commit]
    steps:
      - install-deps: apk add --no-cache curl
      - install: curl -fsSL https://revyl.com/install.sh | sh
      - run-tests: revyl workflow run smoke-tests

  # Fire-and-forget: queue tests and exit immediately
  test-async:
    requires: [~pr, ~commit]
    steps:
      - install-deps: apk add --no-cache curl
      - install: curl -fsSL https://revyl.com/install.sh | sh
      - run-tests: revyl workflow run smoke-tests --no-wait

  # Check status of the latest execution
  check-status:
    requires: [test-async]
    steps:
      - install-deps: apk add --no-cache curl
      - install: curl -fsSL https://revyl.com/install.sh | sh
      - status: revyl workflow status smoke-tests --json

  # Build, upload, then test
  build-and-test:
    requires: [~commit]
    steps:
      - install-deps: apk add --no-cache curl jq
      - install: curl -fsSL https://revyl.com/install.sh | sh
      - build: ./gradlew assembleDebug   # <-- replace with your build command
      - upload-and-test: |
          set -e
          APP_ID="your-android-app-id"
          revyl build upload --file ./app/build/outputs/apk/debug/app-debug.apk --app "$APP_ID" --yes --json > build.json
          BUILD_ID=$(jq -er 'select(.success == true and .count == 1) | .build.build_id | select(type == "string" and length > 0)' build.json)
          revyl workflow run smoke-tests --android-app "$APP_ID" --android-build-id "$BUILD_ID"
