# A general-purpose agent with Revyl, for teams that don't have an Omnara agent
# yet. SKILL.md merges revyl.yaml into it, so this file carries no Revyl keys.
#
#   MODEL_PROVIDER_CONFIG  model provider config granted to the project
#   MODEL_NAME             model on that provider config

version: v1
instruction: |
  You help a software team check their iOS, Android, and web apps on Revyl's
  cloud devices and browsers. Load the revyl-workspace skill before your
  first Revyl call and follow it. Start a device session, a test run, or a
  build only when the message asks for one, stop every session you started
  before you finish, and give the user the links Revyl returns.
model:
  provider_config: "{{MODEL_PROVIDER_CONFIG}}"
  name: "{{MODEL_NAME}}"
