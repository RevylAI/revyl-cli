# Preview Environment — post a click-to-launch URL for every PR build.
#
# On every push to a PR:
#   1. Builds the app artifact locally with EAS
#   2. Uploads it to Revyl with --preview
#   3. Posts a PR comment with preview_url
#
# Opening the URL auto-starts a simulator and opens the normal session
# viewer. Upload itself does not start a device, so PRs do not bill a
# session until someone clicks.
#
# Secrets needed: REVYL_API_KEY, EXPO_TOKEN

name: Preview Environment

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build iOS preview artifact
        run: npx eas-cli build --platform ios --profile preview --local --non-interactive --output build/app.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install Revyl CLI
        run: |
          curl -fsSL https://revyl.com/install.sh | sh
          echo "$HOME/.revyl/bin" >> "$GITHUB_PATH"

      - name: Upload build to Revyl
        id: upload
        run: |
          OUTPUT=$(revyl build upload -f build/app.tar.gz --app "your-app-id" --yes --preview --json)
          echo "$OUTPUT"
          BUILD_ID=$(echo "$OUTPUT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          build = data.get('build') or (data.get('builds') or [{}])[0]
          print(build.get('build_id', ''))
          ")
          PREVIEW=$(echo "$OUTPUT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          build = data.get('build') or (data.get('builds') or [{}])[0]
          print(build.get('preview_url', ''))
          ")
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "preview-url=$PREVIEW" >> "$GITHUB_OUTPUT"
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}

      - name: Post preview link to PR
        uses: actions/github-script@v7
        with:
          script: |
            const preview = '${{ steps.upload.outputs.preview-url }}';
            const build  = '${{ steps.upload.outputs.build-id }}';

            const body = [
              `## Preview Environment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Build** | \`${build}\` |`,
              `| **Commit** | \`${context.sha.substring(0, 8)}\` |`,
              `| **Platform** | iOS |`,
              ``,
              `**[Open Preview](${preview})**`,
              ``,
              `Opening the link starts a simulator with this build and opens the session viewer.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
