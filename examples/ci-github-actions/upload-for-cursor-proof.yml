  #       run: |
  #         revyl build upload \
  #           --file ./dist/app-debug.apk \
  #           --app "$REVYL_ANDROID_APP_ID" \
  #           --platform android \
  #           --version "${{ github.event.pull_request.head.sha || github.sha }}" \
  #           --yes \
  #           --json
  #       env:
  #         REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
  #         REVYL_ANDROID_APP_ID: ${{ vars.REVYL_ANDROID_APP_ID }}
